name: 'Fork: Weekly Build to GHCR'

# Fork-only workflow (not part of upstream DMS).
# Rebuilds the image from scratch every week so it picks up the latest
# Debian security updates, runs the DMS test suite against it, and then
# publishes it to ghcr.io/<owner>/docker-mailserver.
#
# The image is first pushed as `:candidate`. Only when every test part passes
# on the default branch does it get the `latest`, date and sha tags.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 0'

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: 'Build (AMD64)'
    runs-on: ubuntu-24.04
    outputs:
      candidate: ${{ steps.push.outputs.candidate }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7

      - name: 'Prepare tags'
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value={{date 'YYYYMMDD'}}
            type=sha

      - name: 'Set up Docker Buildx'
        uses: docker/setup-buildx-action@v4.4.1

      # No layer cache on purpose: a cached `apt-get upgrade` layer would
      # skip the Debian security updates that this weekly build exists for.
      - name: 'Build image'
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          build-args: |
            DOVECOT_COMMUNITY_REPO=1
            DMS_RELEASE=edge
            VCS_REVISION=${{ github.sha }}
          platforms: linux/amd64
          pull: true
          no-cache: true
          load: true
          tags: ${{ env.IMAGE }}:candidate
          labels: ${{ steps.meta.outputs.labels }}

      - name: 'Check package sources'
        run: |
          set -euo pipefail
          function in_image() { docker run --rm --entrypoint '' "${IMAGE}:candidate" "${@}" ; }
          function pkg_version() { in_image dpkg-query -W -f="\${Version}" "${1}" ; }

          # Dovecot CE packages use epoch 2, Debian's own packages use epoch 1:
          DOVECOT_VERSION=$(pkg_version dovecot-core)
          if [[ ${DOVECOT_VERSION} != 2:* ]]; then
            echo "::error::dovecot-core ${DOVECOT_VERSION} is not from the Dovecot CE repo"
            exit 1
          fi

          {
            echo '### Package versions'
            echo '| Package | Version |'
            echo '| :- | :- |'
            for PKG in dovecot-core postfix rspamd clamav valkey-server openssl; do
              echo "| ${PKG} | $(pkg_version "${PKG}") |"
            done
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: 'Login to GitHub Container Registry'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Push candidate image'
        id: push
        run: |
          set -euo pipefail
          docker push "${IMAGE}:candidate"
          echo "candidate=$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:candidate")" >>"${GITHUB_OUTPUT}"

  test:
    name: 'Test'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        part: [serial, parallel/set1, parallel/set2, parallel/set3]
      fail-fast: false
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: 'Login to GitHub Container Registry'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Pull candidate image'
        env:
          CANDIDATE: ${{ needs.build.outputs.candidate }}
        run: |
          docker pull "${CANDIDATE}"
          docker tag "${CANDIDATE}" mailserver-testing:ci

      - name: 'Run tests'
        run: make generate-accounts tests/${{ matrix.part }}

  publish:
    name: 'Publish'
    needs: [build, test]
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    steps:
      - name: 'Set up Docker Buildx'
        uses: docker/setup-buildx-action@v4.4.1

      - name: 'Login to GitHub Container Registry'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Re-tags the tested image by digest, so the published image is exactly the one that passed the tests:
      - name: 'Tag tested image'
        env:
          CANDIDATE: ${{ needs.build.outputs.candidate }}
          TAGS: ${{ needs.build.outputs.tags }}
        run: |
          set -euo pipefail
          mapfile -t TAG_LIST < <(grep -v '^$' <<<"${TAGS}")
          docker buildx imagetools create "${TAG_LIST[@]/#/--tag=}" "${CANDIDATE}"
