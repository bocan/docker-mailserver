name: 'Fork: Weekly Build to GHCR'

# Fork-only workflow (not part of upstream DMS).
# Rebuilds the image from scratch every week so it picks up the latest
# Debian security updates, and publishes it to ghcr.io/<owner>/docker-mailserver.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 0'

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build-test-publish:
    name: 'Build, Test & Publish (AMD64)'
    runs-on: ubuntu-24.04
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7

      - name: 'Prepare tags'
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{date 'YYYYMMDD'}}
            type=sha

      - name: 'Set up Docker Buildx'
        uses: docker/setup-buildx-action@v4.4.1

      # No layer cache on purpose: a cached `apt-get upgrade` layer would
      # skip the Debian security updates that this weekly build exists for.
      - name: 'Build image'
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          build-args: |
            DOVECOT_COMMUNITY_REPO=1
            DMS_RELEASE=edge
            VCS_REVISION=${{ github.sha }}
          platforms: linux/amd64
          pull: true
          no-cache: true
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: 'Smoke test'
        env:
          IMAGE: ${{ steps.build.outputs.imageid }}
        run: |
          set -euo pipefail
          function in_image() { docker run --rm --entrypoint '' "${IMAGE}" "${@}" ; }
          function pkg_version() { in_image dpkg-query -W -f="\${Version}" "${1}" ; }

          # Dovecot CE packages use epoch 2, Debian's own packages use epoch 1:
          DOVECOT_VERSION=$(pkg_version dovecot-core)
          if [[ ${DOVECOT_VERSION} != 2:* ]]; then
            echo "::error::dovecot-core ${DOVECOT_VERSION} is not from the Dovecot CE repo"
            exit 1
          fi

          {
            echo '### Package versions'
            echo '| Package | Version |'
            echo '| :- | :- |'
            for PKG in dovecot-core postfix rspamd clamav valkey-server openssl; do
              echo "| ${PKG} | $(pkg_version "${PKG}") |"
            done
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: 'Login to GitHub Container Registry'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Publish image'
        run: docker push --all-tags ghcr.io/${{ github.repository }}
